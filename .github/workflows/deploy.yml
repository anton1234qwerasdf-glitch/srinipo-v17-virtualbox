name: Build and deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: srinipo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, srinipo-vbox]
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t "srinipo-app:$GITHUB_SHA" .

      - name: Check JavaScript syntax
        run: docker run --rm "srinipo-app:$GITHUB_SHA" node --check app.js

      - name: Replace application container
        run: |
          if docker container inspect srinipo-web >/dev/null 2>&1; then
            docker rm -f srinipo-web
          fi
          docker run -d \
            --name srinipo-web \
            --restart unless-stopped \
            -p 127.0.0.1:8888:80 \
            "srinipo-app:$GITHUB_SHA"

      - name: Check HTTP response
        run: |
          curl --fail --show-error \
            --retry 10 --retry-all-errors --retry-delay 2 \
            --connect-timeout 3 --max-time 5 \
            http://127.0.0.1:8888/
